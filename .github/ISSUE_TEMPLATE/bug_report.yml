name: "Rapport de Bug"
description: "Signaler un bug ou un comportement inattendu"
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de signaler ce bug. Remplissez les informations ci-dessous pour nous aider à le reproduire.

  - type: textarea
    id: description
    attributes:
      label: Description du bug
      description: Décrivez clairement le problème rencontré.
      placeholder: "Quand je clique sur le bouton X, rien ne se passe..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: Comment reproduire ce bug ?
      placeholder: |
        1. Aller sur la page '...'
        2. Cliquer sur '...'
        3. Observer le résultat
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Que devrait-il se passer normalement ?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportement actuel
      description: Que se passe-t-il réellement ?
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Sévérité
      options:
        - Critique (bloquant)
        - Majeur (fonctionnalité impactée)
        - Mineur (contournement possible)
        - Cosmétique (visuel uniquement)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environnement
      description: Navigateur, OS, version de l'app...
      placeholder: |
        - Navigateur : Chrome 126
        - OS : Windows 11
        - Version : v1.2.3

  - type: textarea
    id: screenshots
    attributes:
      label: Captures d'écran
      description: Ajoutez des captures si pertinent (glissez-déposez)
